services:
  app:
    image: paymongo-api-dashboard:development
    build:
      context: .
      target: development
    init: true
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      - .:/app
      - app_node_modules:/app/node_modules
      - app_next:/app/.next

volumes:
  app_node_modules:
  app_next:
