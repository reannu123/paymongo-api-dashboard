services:
  app:
    image: ghcr.io/reannu123/paymongo-api-dashboard:${IMAGE_TAG:-main}
    pull_policy: always
    init: true
    restart: unless-stopped
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
      PAYMONGO_DEMO_MODE: "${PAYMONGO_DEMO_MODE:-true}"
    ports:
      - "${APP_PORT:-3023}:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
